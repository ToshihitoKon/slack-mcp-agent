[project]
name = "slack-mcp-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.1",
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-aws>=1.4",
    "mcp>=1.27",
    "slack-bolt>=1.28",
    "aiohttp>=3.13",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.4"]
openai = ["langchain-openai>=1.1"]
bedrock = ["langchain-aws>=1.4"]
ollama = ["langchain-ollama>=1.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["slack_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
